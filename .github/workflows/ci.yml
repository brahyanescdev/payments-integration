name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the coverage bot needs to write its comment on the PR.
permissions:
  contents: read
  pull-requests: write

env:
  # Node 25 no longer ships Corepack, so pnpm is installed explicitly by the action.
  NODE_VERSION: '22'
  PNPM_VERSION: '11.22.0'

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage gate
        run: pnpm --filter @payments/shared test:cov && pnpm --filter @payments/api test:cov

      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: |
            apps/api/coverage/coverage-summary.json
            packages/shared/coverage/coverage-summary.json
          retention-days: 7

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage gate
        run: pnpm --filter @payments/web test:cov

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: apps/web/coverage/coverage-summary.json
          retention-days: 7

      - name: Production build
        run: pnpm --filter @payments/web build
        env:
          VITE_API_BASE_URL: http://localhost:3000/api/v1

  # Aggregates both jobs into a single sticky comment. Running after them avoids
  # two parallel jobs racing to edit the same comment.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.event_name == 'pull_request' && !cancelled()
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download coverage summaries
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Render the coverage table
        run: |
          pnpm coverage:report \
            "@payments/api=coverage-artifacts/apps/api/coverage/coverage-summary.json" \
            "@payments/shared=coverage-artifacts/packages/shared/coverage/coverage-summary.json" \
            "@payments/web=coverage-artifacts/apps/web/coverage/coverage-summary.json" \
            > coverage-comment.md

      - name: Publish it on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file coverage-comment.md --edit-last --create-if-none

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @payments/e2e exec playwright install --with-deps chromium

      - name: Build deployable artefacts
        run: pnpm build
        env:
          VITE_API_BASE_URL: http://localhost:3000/api/v1

      # The fake gateway keeps runs deterministic: the shared sandbox account can be
      # signed out from elsewhere, which would fail the pipeline for reasons that
      # have nothing to do with the change under review.
      - name: End-to-end suite
        run: pnpm e2e
        env:
          E2E_GATEWAY_DRIVER: fake
          E2E_DATABASE_URL: postgresql://payments:payments@localhost:5432/payments

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 30
